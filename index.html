const DATA=[{"title": {"de": "Energie für deinen Tag", "uk": "Енергія на щодень"}, "text": {"de": "Du denkst, gehst und spielst. Dafür braucht dein Körper Energie. Kohlenhydrate sind eine wichtige Energiequelle. Auch Fett liefert Energie. Du brauchst eine abwechslungsreiche Ernährung.", "uk": "Ти думаєш, ходиш і граєшся. Для цього тілу потрібна енергія. Вуглеводи — важливе джерело енергії. Жири теж дають енергію. Харчування має бути різноманітним."}, "memo": {"de": "Kohlenhydrate liefern meinem Körper Energie.", "uk": "Вуглеводи дають моєму тілу енергію."}, "questions": [{"q": {"de": "Welche Aufgabe haben Kohlenhydrate?", "uk": "Яку функцію мають вуглеводи?"}, "options": [{"de": "Sie liefern Energie.", "uk": "Вони дають енергію."}, {"de": "Sie ersetzen Schlaf.", "uk": "Вони замінюють сон."}, {"de": "Sie reinigen die Zähne.", "uk": "Вони чистять зуби."}, {"de": "Sie ersetzen Wasser.", "uk": "Вони замінюють воду."}], "explain": {"de": "Dein Körper nutzt Kohlenhydrate zur Energiegewinnung. Schlaf und Wasser braucht er trotzdem.", "uk": "Тіло отримує енергію з вуглеводів. Сон і вода все одно потрібні."}}, {"q": {"de": "Beim Spielen verbraucht dein Körper Energie. Was können Kohlenhydrate beitragen?", "uk": "Під час гри тіло витрачає енергію. Чим допомагають вуглеводи?"}, "options": [{"de": "Energie für die Aktivität liefern.", "uk": "Дають енергію для активності."}, {"de": "Alle Pausen überflüssig machen.", "uk": "Роблять перерви непотрібними."}, {"de": "Den Durst dauerhaft löschen.", "uk": "Назавжди втамовують спрагу."}, {"de": "Bewegung ersetzen.", "uk": "Замінюють рух."}], "explain": {"de": "Kohlenhydrate sind ein Brennstoff für den Körper.", "uk": "Вуглеводи — паливо для тіла."}}, {"q": {"de": "Welche Aussage stimmt?", "uk": "Яке твердження правильне?"}, "options": [{"de": "Kohlenhydrate und Fett können Energie liefern.", "uk": "Вуглеводи й жири можуть давати енергію."}, {"de": "Nur Süßigkeiten liefern Energie.", "uk": "Лише солодощі дають енергію."}, {"de": "Wasser римує глюкозу також із крохмалю."}, {"de": "Ja, nur Cola versorgt das Gehirn.", "uk": "Так, лише кола живить мозок."}, {"de": "Ja, Wasser verhindert das Denken.", "uk": "Так, вода заважає думати."}, {"de": "Nein, das Gehirn braucht nie Energie.", "uk": "Ні, мозку ніколи не потрібна енергія."}], "explain": {"de": "Stärke wird bei der Verdauung zu Glukose abgebaut.", "uk": "Під час травлення крохмаль розщеплюється до глюкози."}}, {"q": {"de": "Warum kann eine Mahlzeit mit Kartoffeln beim Versorgen des Körpers helfen?", "uk": "Чому страва з картоплею допомагає забезпечити тіло?"}, "options": [{"de": "Ihre Stärke liefert Energie für Gehirn und Muskeln.", "uk": "Її крохмаль дає енергію мозку й м’язам."}, {"de": "Kartoffeln ersetzen jeden Schlaf.", "uk": "Картопля замінює сон."}, {"de": "Kartoffeln machen Muskeln sofort größer.", "uk": "Картопля миттєво збільшує м’язи."}, {"de": "Das Gehirn benötigt nur Vitamine, keine Energie.", "uk": "Мозку потрібні лише вітаміни, без енергії."}], "explain": {"de": "Energie unterstützt die Arbeit der Organe. Muskeln wachsen nicht sofort durch ein Lebensmittel.", "uk": "Енергія підтримує роботу органів. М’язи не ростуть миттєво від одного продукту."}}]}, {"title": {"de": "Zucker gehört dazu", "uk": "Цукор теж належить до них"}, "text": {"de": "Kohlenhydrate bestehen aus Zuckerbausteinen. Traubenzucker ist ein einzelner Baustein. Haushaltszucker besteht aus zwei verbundenen Bausteinen. Zucker schmeckt süß. Er steckt zum Beispiel in normaler Cola, aber auch von Natur aus in Obst und Milch. Obst ist deshalb nicht dasselbe wie eine Süßigkeit.", "uk": "Вуглеводи складаються з цукрових ланок. Глюкоза — одна ланка. Столовий цукор складається з двох з’єднаних ланок. Цукор солодкий. Він є у звичайній колі, а також природно у фруктах і молоці. Тому фрукти — не те саме, що солодощі."}, "memo": {"de": "Auch Zucker gehört zu den Kohlenhydraten.", "uk": "Цукор теж належить до вуглеводів."}, "questions": [{"q": {"de": "Zu welcher Nährstoffgruppe gehört Zucker?", "uk": "До якої групи поживних речовин належить цукор?"}, "options": [{"de": "Zu den Kohlenhydraten.", "uk": "До вуглеводів."}, {"de": "Zu den Vitaminen.", "uk": "До вітамінів."}, {"de": "Zu den Mineralstoffen.", "uk": "До мінеральних речовин."}, {"de": "Zu den Fetten.", "uk": "До жирів."}], "explain": {"de": "Zucker ist eine Form von Kohlenhydraten.", "uk": "Цукор — форма вуглеводів."}}, {"q": {"de": "Enthält normale zuckerhaltige Cola Kohlenhydrate?", "uk": "Чи містить звичайна солодка кола вуглеводи?"}, "options": [{"de": "Ja, in Form von Zucker.", "uk": "Так, у формі цукру."}, {"de": "Nein, nur feste Lebensmittel enthalten sie.", "uk": "Ні, вони є лише у твердій їжі."}, {"de": "Nein, Zucker ist ein Vitamin.", "uk": "Ні, цукор — це вітамін."}, {"de": "Ja, ausschließlich als Ballaststoffe.", "uk": "Так, лише у формі клітковини."}], "explain": {"de": "Auch Getränke können Kohlenhydrate enthalten.", "uk": "Напої теж можуть містити вуглеводи."}}, {"q": {"de": "Ein Apfel enthält Zucker. Was stimmt trotzdem?", "uk": "Яблуко містить цукор. Що все одно правильно?"}, "options": [{"de": "Er liefert auch Ballaststoffe und weitere Nährstoffe.", "uk": "Воно також дає клітковину та інші поживні речовини."}, {"de": "Er besteht nur aus Haushaltszucker.", "uk": "Воно складається лише зі столового цукру."}, {"de": "Er ist deshalb genauso wie Cola.", "uk": "Тому воно таке саме, як кола."}, {"de": "Er enthält keine Kohlenhydrate.", "uk": "Воно не містить вуглеводів."}], "explain": {"de": "Das ganze Lebensmittel zählt: Obst enthält neben Zucker weitere wertvolle Stoffe.", "uk": "Важливий увесь продукт: фрукти містять і цукор, і інші цінні речовини."}}]}, {"title": {"de": "Stärke: eine lange Kette", "uk": "Крохмаль: довгий ланцюжок"}, "text": {"de": "Stärke besteht aus vielen verbundenen Glukose-Bausteinen. Sie steckt zum Beispiel in Kartoffeln, Nudeln und Brot. Bei der Verdauung zerlegt dein Körper die Ketten. Die kleinen Bausteine können dann ins Blut gelangen und Energie liefern. Stärke schmeckt zunächst meist nicht süß.", "uk": "Крохмаль складається з багатьох з’єднаних ланок глюкози. Він є, наприклад, у картоплі, макаронах і хлібі. Під час травлення тіло розщеплює ланцюжки. Маленькі ланки потрапляють у кров і дають енергію. Спочатку крохмаль зазвичай не солодкий."}, "memo": {"de": "Stärke besteht aus vielen verbundenen Zuckerbausteinen.", "uk": "Крохмаль складається з багатьох з’єднаних цукрових ланок."}, "questions": [{"q": {"de": "Was beschreibt Stärke richtig?", "uk": "Який опис крохмалю правильний?"}, "options": [{"de": "Eine lange Kette aus Zuckerbausteinen.", "uk": "Довгий ланцюжок із цукрових ланок."}, {"de": "Ein einzelnes Vitamin.", "uk": "Один вітамін."}, {"de": "Wasser mit Mineralstoffen.", "uk": "Вода з мінеральними речовинами."}, {"de": "Ein Stoff ohne Energie.", "uk": "Речовина без енергії."}], "explain": {"de": "Viele Glukose-Bausteine bilden zusammen Stärke.", "uk": "Багато ланок глюкози разом утворюють крохмаль."}}, {"q": {"de": "Was geschieht bei der Verdauung von Stärke?", "uk": "Що відбувається під час перетравлення крохмалю?"}, "options": [{"de": "Die Ketten werden in kleine Bausteine zerlegt.", "uk": "Ланцюжки розщеплюються на маленькі ланки."}, {"de": "Die Ketten wandern unverändert ins Gehirn.", "uk": "Ланцюжки без змін потрапляють у мозок."}, {"de": "Stärke wird zu Salz.", "uk": "Крохмаль стає сіллю."}, {"de": "Stärke verschwindet ohne Nutzen.", "uk": "Крохмаль зникає без користі."}], "explain": {"de": "Erst nach dem Abbau können die Glukose-Bausteine aufgenommen werden.", "uk": "Ланки глюкози можуть засвоюватися після розщеплення."}}, {"q": {"de": "Was unterscheidet Haushaltszucker von Stärke?", "uk": "Чим відрізняється столовий цукор від крохмалю?"}, "options": [{"de": "Haushaltszucker hat zwei Bausteine, Stärke sehr viele.", "uk": "Цукор має дві ланки, крохмаль — дуже багато."}, {"de": "Stärke ist ein Vitamin, Zucker ein Fett.", "uk": "Крохмаль — вітамін, цукор — жир."}, {"de": "Nur Zucker kann Energie рони."}, {"de": "Normale Nudeln mit Zucker.", "uk": "Звичайні макарони з цукром."}, {"de": "Cola statt Nudeln.", "uk": "Колу замість макаронів."}, {"de": "Nur Nudelwasser.", "uk": "Лише воду від макаронів."}], "explain": {"de": "Die Vollkornvariante liefert mehr Ballaststoffe.", "uk": "Цільнозерновий варіант дає більше клітковини."}}, {"q": {"de": "Warum ist Vollkorn für den Alltag eine gute Wahl?", "uk": "Чому цільнозернові продукти — добрий щоденний вибір?"}, "options": [{"de": "Es liefert Energie und zusätzlich viele Ballaststoffe.", "uk": "Вони дають енергію та багато клітковини."}, {"de": "Es enthält keine Kohlenhydrate.", "uk": "Вони не містять вуглеводів."}, {"de": "Es ersetzt Obst und Gemüse vollständig.", "uk": "Вони повністю замінюють фрукти й овочі."}, {"de": "Es macht Bewegung unnötig.", "uk": "Вони роблять рух непотрібним."}], "explain": {"de": "Vollkorn liefert Kohlenhydrate und wertvolle Begleitstoffe.", "uk": "Цільне зерно дає вуглеводи й інші цінні речовини."}}]}, {"title": {"de": "Cola oder eine Mahlzeit?", "uk": "Кола чи повноцінна їжа?"}, "text": {"de": "Normale Cola liefert Energie durch Zucker. Sie enthält aber kaum Vitamine und Mineralstoffe und keine Ballaststoffe. Eine Mahlzeit mit Kartoffeln oder Vollkornprodukten kann Energie und weitere Nährstoffe liefern. Zuckerhaltige Getränke ersetzen keine ausgewogene Mahlzeit. Wasser bleibt dein Durstlöscher.", "uk": "Звичайна кола дає енергію завдяки цукру. Але вона майже не містить вітамінів і мінеральних речовин та не містить клітковини. Страва з картоплею або цільнозерновими продуктами дає енергію й інші поживні речовини. Солодкі напої не замінюють збалансовану їжу. Спрагу втамовуй водою."}, "memo": {"de": "Zuckerhaltige Cola liefert Energie, aber kaum weitere wichtige Nährstoffe.", "uk": "Солодка кола дає енергію, але майже не дає інших важливих поживних речовин."}, "questions": [{"q": {"de": "Warum ersetzt Cola keine ausgewogene Mahlzeit?", "uk": "Чому кола не замінює збалансовану їжу?"}, "opti yTitle:['Erkunde beide Bereiche','Досліди обидві ділянки'],brain:['🧠 Gehirn','🧠 Мозок'],muscle:['💪 Muskeln','💪 М’язи'],brainText:['Beim Lesen, Erinnern und Denken arbeitet dein Gehirn. Es braucht dafür ständig Energie.','Під час читання, запам’ятовування й мислення мозок працює. Для цього йому постійно потрібна енергія.'],muscleText:['Beim Gehen, Tanzen und Sport arbeiten deine Muskeln. Kohlenhydrate können dafür Energie liefern.','Під час ходьби, танців і спорту працюють м’язи. Вуглеводи можуть давати для цього енергію.'],bodyHint:['Tippe auf Gehirn und Muskeln.','Натисни на мозок і м’язи.'],chainTitle:['Zerlege die Stärkekette','Розщепи ланцюжок крохмалю'],chainHint:['Drücke viermal auf „Zerlegen“. Beobachte, wie sich die Verbindungen lösen.','Натисни «Розщепити» чотири рази. Спостерігай, як розриваються зв’язки.'],cut:['Zerlegen','Розщепити'],chainDone:['Die Kette ist zerlegt. Glukose-Bausteine können aufgenommen werden und Energie liefern. Das Modell zeigt nur wenige Bausteine; echte Stärkeketten sind viel länger.','Ланцюжок розщеплено. Ланки глюкози можуть засвоюватися й давати енергію. Модель показує лише кілька ланок; справжні ланцюжки набагато довші.'],sugar:['Haushaltszucker: zwei Bausteine','Столовий цукор: дві ланки'],starch:['Stärke: sehr viele Bausteine','Крохмаль: дуже багато ланок'],whole:['Vollkornbrot','Цільнозерновий хліб'],white:['Weißbrot','Білий хліб'],wholeText:['Energie + mehr Ballaststoffe.','Енергія + більше клітковини.'],whiteText:['Auch Energie, aber weniger Ballaststoffe.','Теж енергія, але менше клітковини.'],feedTitle:['Versorge Alex und vergleiche','Забезпеч Алекса й порівняй'],feedHint:['Probiere alle drei Situationen aus. Sie zeigen vereinfacht, was über eine Zeit passieren kann.','Спробуй усі три ситуації. Вони спрощено показують, що може відбуватися з часом.'],meal:['🥪 Passende Mahlzeit','🥪 Відповідна їжа'],cola:['🥤 Nur normale Cola','🥤 Лише звичайна кола'],little:['🍽️ Insgesamt zu wenig','🍽️ Загалом замало їжі'],mealText:['Alex isst zum Beispiel Vollkornbrot mit Belag und Gemüse und trinkt Wasser. Die Mahlzeit liefert Energie und verschiedene Nährstoffe.','Алекс їсть, наприклад, цільнозерновий хліб із начинкою та овочами й п’є воду. Їжа дає енергію та різні поживні речовини.'],colaText:['Der Zucker liefert Alex Energie. Aber Cola liefert keine Ballaststoffe und kaum weitere wichtige Nährstoffe. Nur Cola ersetzt auf Dauer keine Mahlzeiten.','Цукор дає Алексу енергію. Але кола не дає клітковини й майже не дає інших важливих речовин. Постійно замінювати їжу лише колою не можна.'],littleText:['Bekommt Alex insgesamt zu wenig Energie, kann Alex müde werden und sich schlechter konzentrieren. Das bedeutet nicht: Ohne Süßigkeiten fehlt Energie! Auch andere Lebensmittel liefern sie.','Якщо Алекс загалом отримує замало енергії, може виникнути втома й труднощі із зосередженням. Це не означає, що без солодощів бракує енергії! Інші продукти теж її дають.'],energy:['Energieversorgung im Modell','Енергозабезпечення в моделі'],nutrients:['Vielfalt wichtiger Nährstoffe','Різноманітність важливих речовин'],model:['Die Balken sind symbolisch. Keine Mengenmessung, kein Vergleich gleich großer Portionen. Müdigkeit kann auch andere Ursachen haben, zum Beispiel Schlafmangel.','Стовпчики символічні. Це не вимірювання кількості й не порівняння однакових порцій. Втома може мати й інші причини, наприклад брак сну.'],feedDone:['Alle drei Situationen ausprobiert.','Усі три ситуації випробувано.'],storage:['Speichern ist hier nicht möglich. Lass die Seite während der Bearbeitung geöffnet.','Збереження тут недоступне. Залишай сторінку відкритою під час роботи.'],noAudio:['Vorlesen ist in diesem Browser nicht verfügbar.','У цьому браузері озвучення недоступне.'],bossHint:['Du kannst jederzeit oben in den Lernstationen nachlesen.','Ти завжди можеш перечитати навчальні матеріали вище.']};

function stationDone(i){return state.done.includes(i)&&(i!==1||state.sort===6)&&(i!==2||state.body.length===2)&&(i!==4||state.cuts===4)&&(i!==6||state.feed.length===3)}
const attackNames=[['Energieblitz','Блискавка енергії'],['Vorratswurf','Кидок запасів'],['Denkstoß','Удар думки'],['Zuckerblick','Цукровий погляд'],['Kettenbrecher','Руйнівник ланцюгів'],['Vollkornwirbel','Цільнозерновий вихор'],['Mahlzeitenmacht','Сила їжі'],['Alltagsfinale','Щоденний фінал']];
function renderBoss(){let r=ready(),mode=battle.mode;let html=`<div class="eyebrow" style="color:#ffd15a">${r?'⚔':'🔒'} BOSS</div><h2>${t('boss')}</h2><p>${t('bossIntro')}</p>`;if(!r){$('boss').innerHTML=html+`<div class="locked"><img class="monster" src="${MONSTER}" alt="${t('boss')}"><p>${t('bossLock')}</p><strong>${count()} / 12</strong></div>`;return}let hits=mode==='won'?8:battle.step;html+=`<div class="meterlabel"><span>${state.lang==='de'?'Kraft des Monsters':'Сила монстра'}</span><span>${8-hits} / 8</span></div><div class="meter"><span style="width:${(8-hits)/8*100}%;background:#a995ff"></span></div><div class="battlefield ${mode==='hit'?'hit':mode==='lost'?'eaten':mode==='won'?'victory':''}"><span class="hero-player" aria-label="Alex">🧙</span><span class="blast" aria-hidden="true">⚡</span><img class="monster" src="${MONSTER}" alt="${t('boss')}"></div><div class="attacks">${attackNames.map((a,i)=>`<span class="attack ${i<hits?'used':''}">${i<hits?'✓':'◇'} ${a[state.lang==='de'?0:1]}</span>`).join('')}</div>`;
if(mode==='idle')html+=`<button class="primary" data-action="start">${t('start')}</button>`;
if(mode==='asking'){let b=battle.questions[battle.step],q=DATA[b.topic].questions[b.variant];html+=`<div id="bossQuestion"><div class="row"><h3>${t('attack')} ${battle.step+1} / 8 · ${attackNames[b.topic][state.lang==='de'?0:1]}</h3>${readButton('readboss')}</div><p><strong>${tx(q.q)}</strong></p><div class="options boss-options">${b.order.map((n,j)=>`<button data-action="bossanswer" data-n="${n}"><span class="letter">${'ABCD'[j]}</span>${tx(q.options[n])}</button>`).join('')}</div><p class="muted">${t('bossHint')}</p></div>`}
if(mode==='hit')html+=`<div class="feedback good" role="status"><strong>${t('landed')}</strong> ${tx(battle.feedback)}</div><button class="primary" data-action="continue">${t('continue')}</button>`;
if(mode==='lost')html+=`<div class="feedback bad" role="status"><h3 style="color:inherit">${t('defeat')}</h3><p>${t('defeatText')}</p><strong>${tx(battle.feedback)}</strong></div><button class="primary" data-action="start">${t('again')}</button>`;
if(mode==='won'||(mode==='idle'&&state.won))html+=`<div class="feedback good" role="status"><h3 style="color:inherit">${t('victory')}</h3><p>${t('victoryText')}</p><a href="#summary">${t('toSummary')}</a></div>`;
$('boss').innerHTML=html}
function renderSummary(){$('summary').innerHTML=`<h2>${state.won?'🏆':'🔒'} ${t('summary')}</h2>`+(state.won?`<p>${state.lang==='de'?'Übertrage die Sätze auf dein Arbeitsblatt.':'Перепиши речення на свій робочий аркуш.'}</p><div class="row">${readButton('readsummary')}<button class="small" data-action="print">${t('print')}</button></div><div class="memos">${DATA.map((d,i)=>`<article class="memo"><strong>${i+1}. ${tx(d.title)}</strong><p>${tx(d.memo)}</p></article>`).join('')}</div>`:`<p class="locked">${t('summaryLock')}</p>`)}
function startBattle(){if(!ready())return;stop();state.attempts=(Number(state.attempts)||0)+1;battle={mode:'asking',step:0,feedback:'',questions:DATA.map((d,i)=>({topic:i,variant:1+((state.attempts+i)%2),order:shuffle([0,1,2,3])}))};save();renderBoss();focusBoss()}
function answerBoss(n){if(!ready()||battle.mode!=='asking')return;stop();const b=battle.questions[battle.step],q=DATA[b.topic].questions[b.variant];battle.feedback=q.explain;if(n!==0){battle.mode='lost';battle.step=0}else{battle.step++;battle.mode=battle.step===8?'won':'hit';if(battle.mode==='won'){state.won=true;save();renderSummary();}}renderBoss();if(state.won)updateLocks()}
function focusBoss(){const target=$('bossQuestion')||$('boss');target.setAttribute('tabindex','-1');target.focus({preventScroll:true})}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,n=Number(b.dataset.n),i=Number(b.dataset.i);if(a==='quiz'){stop();if(n===0){complete(i);delete quizFeedback[i]}else quizFeedback[i]=true;renderQuiz(i)}else if(a==='sort'){if(state.sort>=6)return;if(Boolean(n)===foods[state.sort][3]){state.sort++;sortError=false}else sortError=true;renderSort();save();updateLocks()}else if(a==='body'){bodyCurrent=n;if(!state.body.includes(n))state.body.push(n);renderBody();save();updateLocks()}else if(a==='cut'){state.cuts=Math.min(4,state.cuts+1);renderChain();save();updateLocks()}else if(a==='feed'){feedCurrent=n;if(!state.feed.includes(n))state.feed.push(n);renderFeed();save();updateLocks()}else if(a==='start')startBattle();else if(a==='bossanswer')answerBoss(n);else if(a==='continue'&&battle.mode==='hit'){stop();battle.mode='asking';renderBoss();focusBoss()}else if(a==='print'&&state.won)window.print();else if(a==='readsummary'&&state.won)speak(DATA.map(d=>d.memo.de).join(' '));else if(a==='readboss'&&battle.mode==='asking'){let bq=battle.questions[battle.step],q=DATA[bq.topic].questions[bq.variant];speak(q.q.de+' '+bq.order.map(n=>q.options[n].de).join(' '))}else if(a.startsWith('readq-')){let j=Number(a.slice(6)),q=DATA[j].questions[0];speak(q.q.de+' '+quizOrders[j].map(n=>q.options[n].de).join(' '))}else if(a.startsWith('read-')){let j=Number(a.slice(5));speak(DATA[j].title.de+'. '+DATA[j].text.de)}});
$('de').onclick=()=>{stop();state.lang='de';render()};$('uk').onclick=()=>{stop();state.lang='uk';render()};$('stop').onclick=stop;$('reset').onclick=()=>{if(confirm(t('confirm'))){stop();state={lang:state.lang,done:[],sort:0,body:[],cuts:0,feed:[],won:false,attempts:0};battle={mode:'idle',step:0,questions:[],feedback:''};quizFeedback={};sortError=false;feedCurrent=bodyCurrent=null;save();render();window.scrollTo(0,0)}};
render();
try{document.modelContext?.registerTool({name:'read_learning_progress',description:'Read completed learning tasks and boss unlock status; does not solve tasks or reveal answers.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:async input=>{if(input&&Object.keys(input).length)throw Error('No parameters expected');return {completed:count(),total:12,bossUnlocked:ready(),bossWon:state.won}}})}catch(e){}
</script></body></html>
